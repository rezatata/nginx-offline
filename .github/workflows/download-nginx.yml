name: Download Nginx Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-nginx:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Nginx Image
        run: |
          docker pull --platform linux/amd64 nginx:1.30.8

      - name: Verify Image
        run: |
          docker run --rm nginx:1.30.8 nginx -v

      - name: Save Docker Image
        run: |
          docker save -o nginx-1.30.8.tar nginx:1.30.8
          sha256sum nginx-1.30.8.tar > nginx-1.30.8.sha256

      - name: Upload TAR File
        uses: actions/upload-artifact@v4
        with:
          name: nginx-1.30.8-linux-amd64
          path: |
            nginx-1.30.8.tar
            nginx-1.30.8.sha256
          retention-days: 7
